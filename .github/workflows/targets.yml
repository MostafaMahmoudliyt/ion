# Builds the four targets that could not be built where they were written (README "Extensions" table).
# Each job generates a .uapp from examples/mit.json with the CLI, then runs the platform's real toolchain.
# STATUS: written but NOT yet run. The first green run is the proof; expect to fix small errors on the first run.
name: targets
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_cloudflare:
        description: 'Really deploy to Cloudflare (needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets)'
        type: boolean
        default: false

env:
  NODE_VERSION: '22.18'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:types
      - run: npm test

  android:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: node src/cli.ts publish examples/mit.json --out out && node src/cli.ts deploy out/university.ion site
      - name: Assemble debug APK (the generated project has no Gradle wrapper)
        working-directory: site/university.uapp/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: 'site/university.uapp/android/app/build/outputs/apk/debug/*.apk' }

  ios:
    needs: core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: node src/cli.ts publish examples/mit.json --out out && node src/cli.ts deploy out/university.ion site
      - run: brew install xcodegen
      - name: Generate the Xcode project and build for the simulator (no signing needed)
        working-directory: site/university.uapp/ios
        run: |
          xcodegen generate
          xcodebuild -project IonApp.xcodeproj -scheme IonApp -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      # An IPA needs your Apple signing team: archive from Xcode or add a signed `xcodebuild archive` step with your secrets.

  desktop:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries for Tauri 2
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf imagemagick
      - run: node src/cli.ts publish examples/mit.json --out out && node src/cli.ts deploy out/university.ion site
      - name: Placeholder icon (binary files are not generated by Ion; replace with your own PNG)
        working-directory: site/university.uapp/desktop
        run: |
          node -e "const z=require('zlib'),w=1024,raw=Buffer.alloc((w*4+1)*w);for(let y=0;y<w;y++){const o=y*(w*4+1);raw[o]=0;for(let x=0;x<w;x++){const i=o+1+x*4;raw[i]=0x1E;raw[i+1]=0x3A;raw[i+2]=0x8A;raw[i+3]=255}};const crc=(b)=>{let c,t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}let r=0xFFFFFFFF;for(const x of b)r=t[(r^x)&255]^(r>>>8);return(r^0xFFFFFFFF)>>>0};const ch=(ty,d)=>{const l=Buffer.alloc(4);l.writeUInt32BE(d.length);const td=Buffer.concat([Buffer.from(ty),d]);const c=Buffer.alloc(4);c.writeUInt32BE(crc(td));return Buffer.concat([l,td,c])};const ih=Buffer.alloc(13);ih.writeUInt32BE(w,0);ih.writeUInt32BE(w,4);ih[8]=8;ih[9]=6;require('fs').writeFileSync('icon.png',Buffer.concat([Buffer.from([137,80,78,71,13,10,26,10]),ch('IHDR',ih),ch('IDAT',z.deflateSync(raw)),ch('IEND',Buffer.alloc(0))]))"
          npm install
          npx tauri icon icon.png
      - name: Build the installer for this OS
        working-directory: site/university.uapp/desktop
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: 'desktop-${{ matrix.os }}', path: 'site/university.uapp/desktop/src-tauri/target/release/bundle/**' }

  cloudflare:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: node src/cli.ts publish examples/mit.json --out out && node src/cli.ts deploy out/university.ion site
      - name: Validate the config and bundle without deploying (needs no account)
        working-directory: site/university.uapp/cloud/cloudflare
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Deploy for real (only when you ask for it in a manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare
        working-directory: site/university.uapp/cloud/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
